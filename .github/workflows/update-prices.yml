name: Update skin prices

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör prisuppdatering
        run: npm run update
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}

      - name: Committa och pusha nya data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --quiet --cached || git commit -m "Uppdatera priser"
          git pull --rebase --autostash
          git push
